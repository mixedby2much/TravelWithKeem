# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: mixedby2much/TravelWithKeem
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/989bc4c9-5487-4ea5-ae04-d98d5215a917/pkce
  auth_token_endpoint: /sites/989bc4c9-5487-4ea5-ae04-d98d5215a917/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://travelwithkeem.com

media_folder: "assets/gallery"
public_folder: "assets/gallery"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "data/settings.json"
        name: "settings"
        label: "Site Settings"
        fields:
          - { label: "WhatsApp Number (digits only, with country code)", name: "whatsappNumber", widget: "string" }

  - name: "tiers"
    label: "Pricing Tiers"
    files:
      - file: "data/tiers.json"
        name: "tiers"
        label: "Pricing Tiers"
        fields:
          - label: "Tiers"
            name: "tiers"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Icon (emoji)", name: "icon", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Show \"Popular\" badge", name: "popular", widget: "boolean", default: false }
              - { label: "Best For", name: "bestFor", widget: "text" }
              - label: "Price Options"
                name: "prices"
                widget: "list"
                summary: "{{label}} — {{amount}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Description", name: "desc", widget: "string" }
                  - { label: "Amount", name: "amount", widget: "string" }
              - label: "Includes"
                name: "includes"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "Add-ons", name: "addons", widget: "text" }

  - name: "gallery"
    label: "Past Trips Gallery"
    files:
      - file: "data/gallery.json"
        name: "gallery"
        label: "Past Trips Gallery"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "src", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }
